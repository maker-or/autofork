name: autofork
description: Rebuild your fork from upstream plus your patches. An agent re-implements the ones that break.
author: AVGVSTVS96
branding:
  icon: git-merge
  color: green
inputs:
  token:
    description: Token that pushes the signed sync commit
    default: ${{ github.token }}
  heal:
    description: Let the agent rebuild patches that no longer apply or fail verify. When false, they wait for a run that heals.
    default: "true"
  codex-auth-url:
    description: "Where to send Codex's sign-in after it refreshes, so the CODEX_AUTH secret stays current. Needs `id-token: write`."
    default: ""
outputs:
  result:
    description: synced, current, waiting, skipped, moved, or failed
    value: ${{ steps.sync.outputs.result }}
  tag:
    description: The upstream release tag a sync moved to, when the fork follows releases
    value: ${{ steps.sync.outputs.tag }}
runs:
  using: composite
  steps:
    - uses: actions/cache/restore@v6
      with:
        path: ${{ runner.temp }}/autofork-failed
        key: autofork-failed-${{ github.run_id }}
        restore-keys: autofork-failed-
    - id: sync
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        HEAL: ${{ inputs.heal }}
        CODEX_AUTH_URL: ${{ inputs.codex-auth-url }}
      run: '"$GITHUB_ACTION_PATH/action.sh"'
    - if: (failure() || cancelled()) && steps.sync.outputs.key != ''
      shell: bash
      run: echo '${{ steps.sync.outputs.key }}' > "$RUNNER_TEMP/autofork-failed"
    - if: (failure() || cancelled()) && steps.sync.outputs.key != ''
      uses: actions/cache/save@v6
      with:
        path: ${{ runner.temp }}/autofork-failed
        key: autofork-failed-${{ steps.sync.outputs.key }}
